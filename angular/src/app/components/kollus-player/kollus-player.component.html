<!-- 플레이어 템플릿: 에러/로딩 상태와 JWT 서명된 Kollus 플레이어 iframe을 렌더링한다 -->
@if (error) {
  <p class="error-text">{{ error }}</p>
} @else if (!playerUrl) {
  <p>플레이어를 불러오는 중...</p>
} @else {
  <div>
    <iframe
      #playerIframe
      [src]="playerUrl"
      width="640"
      height="360"
      frameborder="0"
      allow="encrypted-media; local-network-access"
      allowfullscreen
      webkitallowfullscreen
      mozallowfullscreen
      title="Kollus Player"
      (load)="handleIframeLoad()"
    ></iframe>
    <p>재생 상태: <code>{{ playerStatus }}</code></p>
  </div>
}
